# CI — sesuai CONVENTIONS.md: lint → test (coverage gate) → build → scan → push GHCR
# AC Fase 4 (docs/ROADMAP.md):
#   - PR hijau otomatis sebelum merge
#   - merge ke main → image tersedia di GHCR ber-tag sha-<7digit> (+ latest)
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - name: ruff check
        run: ruff check app tests migrations
      - name: ruff format (konsistensi)
        run: ruff format --check app tests migrations

  test:
    name: Test + coverage (gate 80%)
    runs-on: ubuntu-latest
    services:
      # Service containers — postgres & redis sungguhan, sama seperti compose lokal
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: corebank
          POSTGRES_PASSWORD: corebank
          POSTGRES_DB: corebank
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U corebank"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - "6379:6379"
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://corebank:corebank@localhost:5432/corebank
      REDIS_URL: redis://localhost:6379/0
      # Core tracing coverage: default (pytrace) memutus tracing di greenlet
      # SQLAlchemy async → coverage palsu ~73%. Sysmon mencatat benar (~88%).
      COVERAGE_CORE: sysmon
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      # conftest membuat DB terpisah (corebank_test) + menjalankan migrasi asli
      - name: pytest + coverage
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml --cov-fail-under=80
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  build:
    name: Docker build + Trivy scan + push GHCR
    needs: [lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push image ke GHCR
    steps:
      - uses: actions/checkout@v4

      - name: Build image (target runtime)
        run: docker build -f deploy/docker/Dockerfile --target runtime -t corebank-api:ci .

      # Supply chain: scan SEBELUM push — image berisiko tidak boleh terbit
      - name: Trivy scan (CRITICAL/HIGH = gagal)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: corebank-api:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Login ke GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # AC: image di GHCR ber-tag sha-<7digit> saat merge ke main.
      # Nama image WAJIB lowercase (ketentuan GHCR) — repo 'Corebank-api' ditulis manual.
      - name: Tag & push (hanya push ke main)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          IMG="ghcr.io/anggapbwr/corebank-api"
          docker tag corebank-api:ci "$IMG:sha-$SHORT_SHA"
          docker tag corebank-api:ci "$IMG:latest"
          docker push "$IMG:sha-$SHORT_SHA"
          docker push "$IMG:latest"
          echo "Pushed $IMG:sha-$SHORT_SHA"
