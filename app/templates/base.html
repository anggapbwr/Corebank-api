<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CoreBank — Workbench{% endblock %}</title>
  <script src="/static/htmx.min.js"></script>
  <style>
    :root {
      --bg: #f6f7f9; --card: #fff; --line: #e4e7ec; --txt: #1a2230; --muted: #667085;
      --ok: #12b76a; --bad: #f04438; --warn: #f79009; --info: #2e90fa;
    }
    * { box-sizing: border-box; }
    body { margin: 0; font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
           background: var(--bg); color: var(--txt); }
    .topbar { display: flex; justify-content: space-between; align-items: center;
              padding: 12px 20px; background: #0b1220; color: #fff; }
    .brand { font-weight: 700; }
    .brand .muted { font-weight: 400; opacity: .6; font-size: 13px; margin-left: 6px; }
    .layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px;
              padding: 16px 20px; align-items: start; }
    .content h1 { font-size: 18px; margin: 4px 0 12px; }
    .note { color: var(--muted); font-size: 13px; }
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
            padding: 14px 16px; }
    .card .label { font-size: 12px; color: var(--muted); text-transform: uppercase;
                   letter-spacing: .6px; }
    .card .value { font-size: 26px; font-weight: 700; margin-top: 6px; }
    .card .value.ok { color: var(--ok); }
    .card .value.bad { color: var(--bad); }
    .alerts { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
              padding: 14px 16px; min-height: 120px; position: sticky; top: 16px; }
    .alerts h2 { font-size: 14px; margin: 0 0 10px; display: flex; justify-content: space-between;
                 align-items: center; }
    .count { background: var(--bad); color: #fff; border-radius: 999px; padding: 1px 9px;
             font-size: 12px; }
    .count.zero { background: #98a2b3; }
    .alert { border-left: 3px solid var(--warn); background: #fff8ee; border-radius: 6px;
             padding: 8px 10px; margin-bottom: 8px; font-size: 13px; }
    .alert.critical { border-color: var(--bad); background: #fef3f2; }
    .alert.info { border-color: var(--info); background: #eff8ff; }
    .alert .name { font-weight: 600; }
    .alert .sev { font-size: 11px; color: var(--muted); margin-left: 6px; }
    .alert .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .empty, .down { color: var(--muted); font-size: 13px; }
    .down { border-left: 3px solid var(--warn); background: #fff8ee; border-radius: 6px;
            padding: 8px 10px; }
    /* --- My Work (lanjutan Fase 6) --- */
    nav.top a { color: #cbd5e1; text-decoration: none; font-size: 14px; margin-left: 14px; }
    nav.top a:hover, nav.top a.active { color: #fff; }
    .who { font-size: 13px; margin-right: 10px; opacity: .85; }
    .who .role { background: #1d2939; border-radius: 999px; padding: 1px 8px; font-size: 11px; }
    .btn { background: var(--info); color: #fff; border: 0; border-radius: 7px;
           padding: 7px 14px; font-size: 13px; cursor: pointer; }
    .btn:hover { filter: brightness(1.07); }
    .btn.ghost { background: #344054; }
    .btn.danger { background: var(--bad); }
    .btn.sm { padding: 4px 10px; font-size: 12px; }
    .flash { border-radius: 7px; padding: 9px 12px; margin-bottom: 12px; font-size: 13.5px; }
    .flash.ok { background: #ecfdf3; border: 1px solid #abefc6; color: #067647; }
    .flash.err { background: #fef3f2; border: 1px solid #fecdc9; color: #b42318; }
    table.work { width: 100%; border-collapse: collapse; background: var(--card);
                 border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
    table.work th, table.work td { text-align: left; padding: 9px 12px; font-size: 13.5px;
                                   border-bottom: 1px solid var(--line); }
    table.work th { background: #f9fafb; color: var(--muted); font-size: 11.5px;
                    text-transform: uppercase; letter-spacing: .5px; }
    table.work tr:last-child td { border-bottom: 0; }
    .pill { border-radius: 999px; padding: 1px 9px; font-size: 11.5px; font-weight: 600; }
    .pill.pending { background: #fef0c7; color: #b54708; }
    .pill.escalated { background: #fee4e2; color: #b42318; }
    .pill.executed, .pill.active { background: #d1fadf; color: #067647; }
    .pill.rejected, .pill.frozen { background: #fee4e2; color: #b42318; }
    .actions { display: flex; gap: 6px; }
    .login-wrap { max-width: 380px; margin: 48px auto; }
    .login-wrap label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
    .login-wrap input { width: 100%; padding: 9px 11px; font-size: 14px;
                        border: 1px solid var(--line); border-radius: 7px; }
    .login-wrap .btn { width: 100%; margin-top: 18px; padding: 10px; }
    .queue-item { background: var(--card); border: 1px solid var(--line); border-radius: 10px;
                  padding: 12px 14px; margin-bottom: 10px; display: flex;
                  justify-content: space-between; align-items: center; gap: 12px; }
    .queue-item .amount { font-size: 17px; font-weight: 700; }
    .queue-item .meta { color: var(--muted); font-size: 12.5px; margin-top: 2px; }
    @media (max-width: 800px) { .layout { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div style="display:flex;align-items:center">
      <div class="brand">🏦 CoreBank <span class="muted">Workbench</span></div>
      <nav class="top">
        <a href="/" class="{% if active_nav == 'dashboard' %}active{% endif %}">Monitoring</a>
        <a href="/mywork" class="{% if active_nav == 'mywork' %}active{% endif %}">My Work</a>
      </nav>
    </div>
    <div style="display:flex;align-items:center">
      {% if user %}
        <span class="who">{{ user.username }} <span class="role">{{ user.role.value }}</span></span>
        <button class="btn ghost sm"
                hx-post="/logout" hx-swap="none">Logout</button>
      {% else %}
        <a href="/login" style="color:#cbd5e1;font-size:13px;text-decoration:none">Login</a>
      {% endif %}
    </div>
  </header>
  <div class="layout">
    <main class="content">
      {% block content %}{% endblock %}
    </main>
    <aside class="alerts" id="alerts-panel"
           hx-get="/fragments/alerts" hx-trigger="every 20s" hx-swap="innerHTML">
      {% include "partials/_alerts.html" %}
    </aside>
  </div>
</body>
</html>
