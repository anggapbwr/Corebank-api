<div class="cards">
  <div class="card">
    <div class="label">PostgreSQL</div>
    <div class="value {% if health.db_up %}ok{% else %}bad{% endif %}">
      {% if health.db_up %}UP{% else %}DOWN{% endif %}
    </div>
  </div>
  <div class="card">
    <div class="label">Redis</div>
    <div class="value {% if health.redis_up %}ok{% else %}bad{% endif %}">
      {% if health.redis_up %}UP{% else %}DOWN{% endif %}
    </div>
  </div>
  <div class="card">
    <div class="label">Antrean Approval</div>
    <div class="value">{{ health.approval_queue }}</div>
  </div>
</div>
