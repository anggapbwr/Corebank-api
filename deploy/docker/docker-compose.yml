# docker compose lokal (Fase 1): app + postgres + redis + rabbitmq
# Jalankan dari root repo:
#   docker compose -f deploy/docker/docker-compose.yml up -d --build
name: corebank-api

services:
  app:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: runtime
    environment:
      APP_ENV: dev
      DATABASE_URL: postgresql+psycopg://corebank:corebank@postgres:5432/corebank
      REDIS_URL: redis://redis:6379/0
      AMQP_URL: amqp://guest:guest@rabbitmq:5672/
      # Dashboard (Fase 6) mem-proxy alert lewat backend → arahkan ke service alertmanager
      ALERTMANAGER_URL: http://alertmanager:9093
    # Migration dulu, baru serve — pola "migrate on deploy" (peringatan: di K8s
    # dengan multi-replica, jalankan migration sebagai Job terpisah, bukan per-pod)
    command: sh -c "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Service terisolasi untuk test (profile "test"): docker compose --profile test run --rm app-test
  app-test:
    profiles: ["test"]
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: test
    environment:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://corebank:corebank@postgres:5432/corebank
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: corebank
      POSTGRES_PASSWORD: corebank
      POSTGRES_DB: corebank
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corebank -d corebank"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" # management UI: http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ============ Observability (Fase 5) ============
  prometheus:
    image: prom/prometheus:v2.53.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alert_rules.yml:/etc/prometheus/alert_rules.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    depends_on:
      - app
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    # ENTRYPOINT bawaan = binary alertmanager → override entrypoint, bukan command.
    # Template token Telegram: isi dari env; tanpa env, alert tetap terlihat di UI
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        sed -e "s|__TG_BOT_TOKEN__|$${TELEGRAM_BOT_TOKEN:-disabled}|" \
            -e "s|__TG_CHAT_ID__|$${TELEGRAM_CHAT_ID:-1}|" \
            /etc/alertmanager/alertmanager.template.yml > /tmp/alertmanager.yml
        exec /bin/alertmanager --config.file=/tmp/alertmanager.yml --storage.path=/alertmanager
    environment:
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # default 1 (bukan 0): alertmanager menolak chat_id=0 sebagai "missing"
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-1}
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.template.yml:ro
      - alertmanager-data:/alertmanager
    ports:
      - "9093:9093"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped

  loki:
    image: grafana/loki:3.1.1
    # config bawaan image: /etc/loki/local-config.yaml (tanpa override)
    ports:
      - "3100:3100"
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.1.1
    command: -config.file=/etc/promtail/promtail.yml
    volumes:
      - ../monitoring/promtail.yml:/etc/promtail/promtail.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - loki
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  rabbitmq-data:
  prometheus-data:
  alertmanager-data:
  grafana-data:
