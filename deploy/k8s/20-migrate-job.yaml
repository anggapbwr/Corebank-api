# Migrasi Alembic sebagai Job terpisah — BUKAN di dalam container app.
# Alasan (lihat catatan di docker-compose.yml): dengan 2+ replica, "migrate on
# deploy" per-pod berarti beberapa pod menjalankan migrasi bersamaan tanpa lock.
# apply.sh: delete job lama → apply → tunggu complete → baru rollout app.
apiVersion: batch/v1
kind: Job
metadata:
  name: migrate
  namespace: corebank
  labels:
    app: migrate
    app.kubernetes.io/part-of: corebank
spec:
  backoffLimit: 6
  ttlSecondsAfterFinished: 600
  template:
    metadata:
      labels:
        app: migrate
    spec:
      restartPolicy: Never
      containers:
        - name: alembic
          image: corebank-api:kind
          command: ["sh", "-c", "alembic upgrade head"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: corebank-secret
                  key: DATABASE_URL
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
