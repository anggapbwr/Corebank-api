# CONTOH Secret — jangan apply langsung (nilai CHANGE_ME).
# Secret asli dibuat idempoten oleh apply.sh, atau manual:
#   kubectl -n corebank create secret generic corebank-secret \
#     --from-literal=DATABASE_URL='postgresql+psycopg://corebank:<pass>@postgres:5432/corebank' \
#     --from-literal=JWT_SECRET="$(python -c 'import secrets;print(secrets.token_hex(32))')" \
#     --dry-run=client -o yaml | kubectl apply -f -
apiVersion: v1
kind: Secret
metadata:
  name: corebank-secret
  namespace: corebank
  labels:
    app.kubernetes.io/part-of: corebank
type: Opaque
stringData:
  DATABASE_URL: "postgresql+psycopg://corebank:CHANGE_ME@postgres:5432/corebank"
  JWT_SECRET: "CHANGE_ME"
